function drawButtonz(color, x, y, width, height, text, code, initCode, img) {

    processCtx.font = "20px Arial";

function drawButton(color, x,y,width,height,text,code,initCode) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
    
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.textAlign = "center";
    ctx.fillText(text, x + width / 2, y + height / 2 + 7);
}
// activate when mouse down
window.addEventListener('mousedown', function(event) {

  window.buttondown = true;

  const rect = canvas.getBoundingClientRect();
  const clickX = event.clientX - rect.left;
  const clickY = event.clientY - rect.top;

  for(let i = buttons.length - 1; i >= 0; i--){
    const actualwidth = buttons[i].w - buttons[i].x;
    const actualheight = buttons[i].h - buttons[i].y;
    
    
    // Now actualheight has its real value here and works perfectly!
    if(clickX >= buttons[i].x && clickX <= (buttons[i].x + actualwidth) && 
      clickY >= buttons[i].y && clickY <= (buttons[i].y + actualheight)) {
      window.botonActual = buttons[i];
      let processName = "process" + window.botonActual.process;
      if(window.processes[processName]) {
        window.processes[processName].clicked = true;
        window.processes[processName].clickedX = clickX - window.botonActual.x;
        window.processes[processName].clickedY = clickY - window.botonActual.y;
      }
      if (buttons[i].down) {
        if (i === 0) {
          if (clickY <= buttons[i].y + 35) {
            eval(buttons[i].down);
          }
        } else {
          eval(buttons[i].down);
        }
      }
      return; // stop execution once hit found
    }
  }
});

window.addEventListener('mouseup', function(event) {
  for(let l=0; l<buttons.length; l++) {

    let processName = "process" + buttons[l].process;
    if (buttons[l].process && window.processes[processName]) {
      window.processes[processName].clicked = false;
    }
  }
  window.buttondown = false;
  window.isDragging = false;
  window.draggedButton = null;
});


window.addEventListener('mousemove', function(event) {
  const rect = canvas.getBoundingClientRect();
  window.xmg = event.clientX - rect.left;
  window.ymg = event.clientY - rect.top;


  if (window.isDragging && window.draggedButton) {
    let processName = "process" + window.draggedButton.process;
    
    // Safely reads the exact location where your mouse clicked inside the window
    let offsetX = window.processes[processName] ? window.processes[processName].clickedX : (window.draggedButton.w - window.draggedButton.x) / 2;
    let offsetY = window.processes[processName] ? window.processes[processName].clickedY : (window.draggedButton.h - window.draggedButton.y) / 2;

    const currentW = window.draggedButton.w - window.draggedButton.x;
    const currentH = window.draggedButton.h - window.draggedButton.y;

    // Reposition coordinates fluidly out from mouse anchor
    window.draggedButton.x = window.xmg - offsetX;
    window.draggedButton.y = window.ymg - offsetY;
    window.draggedButton.w = window.draggedButton.x + currentW;
    window.draggedButton.h = window.draggedButton.y + currentH;
    
    if(window.processes[processName]){
      window.processes[processName].x = window.draggedButton.x;
      window.processes[processName].y = window.draggedButton.y;
      window.processes[processName].width = currentW;  // Updates stable width parameter
      window.processes[processName].height = currentH; // Updates stable height parameter
    }
  }

});

canvas.addEventListener('click', function(event) {
