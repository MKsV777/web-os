<script>
  const processCanvas = document.getElementById('processCanvas');
  const pprocessCtx = processCanvas.getContext('2d');

  // Set processCanvas size to fill the window
  processCanvas.width = window.innerWidth;
  processCanvas.height = window.innerHeight;
/*
  const img = new Image();

  img.src ="./public/placeholder.svg";

img.addEventListener("load", () => {
  pprocessCtx.drawImage(img, 0, 0);
});*/

var buttons = [
  {}
];

function updatetextarea(){
  const textarea = document.getElementById('textearea');
  textarea.value = JSON.stringify(buttons, null, 2);
}
window.onload = function() {
    // Using forEach solves the asynchronous loop trap
    buttons.forEach((btn) => {
        if (btn.x === undefined) return; // Skip empty starter objects
        
        window.botonActual = btn;
        if (btn.init) eval(btn.init);

        if (btn.img) {
            let staticImg = new Image();
            
            // Set up what to do when THIS specific button's image finishes loading
            staticImg.onload = () => {
                drawButton(btn.color, btn.x, btn.y, btn.w - btn.x, btn.h - btn.y, btn.text, null, null, staticImg);
            };
            
            staticImg.src = btn.img;
        } else {
            // No image? Draw standard color block immediately
            drawButton(btn.color, btn.x, btn.y, btn.w - btn.x, btn.h - btn.y, btn.text);
        }
    });
    
    updatetextarea();
};

// i should press click, letter x then click and then another click and then another letter to get data
document.onkeypress = function (e) {
    e = e || window.event;
    console.log(window.xm / processCanvas.width, " " ,window.ym / processCanvas.height, " ", window.w / processCanvas.width, " ", window.h / processCanvas.height);
};

document.addEventListener('keydown', (event) => {
  // event.key devuelve la letra o tecla presionada
  if(event.key === '¡'){
    console.log(buttons);
  }
});

document.getElementById("tomarx").onclick = function() {
  window.h = window.ym;
  window.w = window.xm;
};
document.getElementById("dropx").onclick = function() {
  window.addbutton();
};

window.addbutton = () => {
    codexc = "";
    codex = "";
    colorx = prompt("color");
    textxd = prompt("text");
    imgxdd = prompt("use the one in area? y:n");
    imgxddd = new Image();
    if(imgxdd == "y" || imgxdd == "Y"){
      imgxddd = new Image();
      // 1. FIXED: Changed .source to .src
      imgxddd.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(document.getElementById('svgEditorarea').value);
      sourcexddd = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(document.getElementById('svgEditorarea').value);
      // 2. FIXED: Force a redraw as soon as the browser finishes building the SVG image
      imgxddd.onload = () => {
         pprocessCtx.clearRect(0, 0, processCanvas.width, processCanvas.height);
         buttons.forEach((btn) => {
             if (btn.img) {
                 let tempImg = new Image();
                 tempImg.onload = () => drawButton(btn.color, btn.x, btn.y, btn.w - btn.x, btn.h - btn.y, btn.text, null, null, tempImg);
                 tempImg.src = btn.img;
             } else {
                 drawButton(btn.color, btn.x, btn.y, btn.w - btn.x, btn.h - btn.y, btn.text);
             }
         });
      };
    }
    buttons.push({x: window.xm, y: window.ym, w: window.w, h: window.h, code: codex, init: codexc, color: colorx, text: textxd, img:sourcexddd});
    drawButton(colorx, window.xm, window.ym, window.w - window.xm, window.h - window.ym, textxd, codex, codexc, imgxddd);
    window.botonActual = buttons[buttons.length - 1];
    eval(buttons[buttons.length - 1].init);
    updatetextarea();
};

function drawButton(color, x, y, width, height, text, code, initCode, img) {
    if (x === undefined || y === undefined) return;

    // FIX 1: DRAW BACKGROUND LAYER FIRST (Image takes priority over color)
    if (img && img instanceof HTMLImageElement) {
        pprocessCtx.drawImage(img, x, y, width, height);
    } else if (color) {
        pprocessCtx.fillStyle = color;
        pprocessCtx.fillRect(x, y, width, height);    
    }
    
    // FIX 2: DRAW TEXT LAYER LAST (So it prints directly on top of the background)
    pprocessCtx.fillStyle = "white";
    pprocessCtx.font = "20px Arial";
    pprocessCtx.textAlign = "center";
    const lines = (text || "").split('\n');
    const lineHeight = 24;
    const totalTextHeight = lines.length * lineHeight;
    let startY = y + (height / 2) - (totalTextHeight / 2) + (lineHeight / 2) + 4;
    for (let i = 0; i < lines.length; i++) {
        pprocessCtx.fillText(lines[i], x + width / 2, startY + (i * lineHeight));
    }
}

processCanvas.addEventListener('click', function(event) {
    const rect = processCanvas.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const clickY = event.clientY - rect.top;

    let clicked = false;

    for(let i = 0; i < buttons.length; i++){
        if (clickX >= buttons[i].x && clickX <= (buttons[i].w) && 
            clickY >= buttons[i].y && clickY <= (buttons[i].h)) {
          //alert("Dynamic Button " + (i + 1) + " clicked!");
          window.botonActual = buttons[i];
          eval(buttons[i].code);
          return; // stop execution once hit found
        }
      }
    window.xm = clickX;
    window.ym = clickY;
});
</script>
