<canvas id="canvas" style="width: 100%; height: 100%;"></canvas>
<canvas id="process" style="width: 100%; height: 100%; display:none "></canvas>

<script>
  //get image from process and apply it to window.img
  const processCanvas = document.getElementById('process');
  const processCtx = processCanvas.getContext('2d');
  processCanvas.width = window.innerWidth;
  processCanvas.height = window.innerHeight;
  
  processCtx.fillStyle = 'red';
  processCtx.beginPath();

  processCtx.arc(150, 150, 50, 0, Math.PI * 2);
  processCtx.fill();

  contador = 0;
  // ADD some sorth of animation to it
  const intervalx = setInterval(() => {
     contador += 1;
    processCtx.clearRect(0, 0, processCanvas.width, processCanvas.height);
    processCtx.fillStyle = 'red';
    processCtx.beginPath();
    // move a square across the screen top to bottom
    if(contador > processCanvas.height) contador = 0;
    processCtx.rect( 50,contador % processCanvas.height, 100, 100);
    processCtx.rect( 50,0, 100, 100);
    processCtx.fill();
  }, 1);

</script>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // Set canvas size to fill the window
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  window.isDragging = false;
  window.draggedButton = null;
  window.xmg = 0;
  window.ymg = 0;
/*

img.addEventListener("load", () => {

var buttons = [
    {
        "x": 4 + 500,
        "y": 65 ,
        "w": 1000 + 500,
        "h": 550 ,
        "code": "",
        "down": "window.isDragging = true; window.draggedButton = window.botonActual",
        "init": "",
        "color": "green",
        "process": 1,
    }

];

        "init": "let img = new Image(); img.onload = function() { ctx.drawImage(img, window.botonActual.x, window.botonActual.y, window.botonActual.w - window.botonActual.x, window.botonActual.h - window.botonActual.y); }; img.src = \"./public/placeholder.svg\";"
    }

window.onload = function() {
    for(let i=0; i<buttons.length; i++) {
        window.botonActual = buttons[i];
        eval(buttons[i].init);
      
        drawButton(buttons[i].color, buttons[i].x, buttons[i].y, buttons[i].w - buttons[i].x, buttons[i].h - buttons[i].y, "New Button");
    }
};

// i should press click, letter x then click and then another click and then another letter to get data
document.onkeypress = function (e) {
    e = e || window.event;
    console.log(window.xm / canvas.width, " " ,window.ym / canvas.height, " ", window.w / canvas.width, " ", window.h / canvas.height);
};

document.addEventListener('keydown', (event) => {
  // event.key devuelve la letra o tecla presionada
  if (event.key === 'x') {
    window.h = window.ym;
    window.w = window.xm;
  }else if(event.key === 'c') {
    window.addbutton();
  }else if(event.key === 's'){
    console.log(buttons);
  }
});

window.addbutton = () => {
    color = prompt("color:");
    if(color == null) color = "#B2BEB5";
    textx = prompt("text:");
    codexc = prompt("init js:");
    codex = prompt("click js:");
    buttons.push({x: window.xm, y: window.ym, w: window.w, h: window.h, code: codex, init: codexc});
    drawButton(color, window.xm, window.ym, window.w - window.xm, window.h - window.ym, textx, codex, codexc);
    window.botonActual = buttons[buttons.length - 1];
    eval(buttons[buttons.length - 1].init);
};

function drawButton(color, x,y,width,height,text,code,initCode) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
    
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.textAlign = "center";
    ctx.fillText(text, x + width / 2, y + height / 2 + 7);
}
// activate when mouse down
window.addEventListener('mousedown', function(event) {

  window.buttondown = true;

  const rect = canvas.getBoundingClientRect();
  const clickX = event.clientX - rect.left;
  const clickY = event.clientY - rect.top;

  for(let i = buttons.length - 1; i >= 0; i--){
    const actualwidth = buttons[i].w - buttons[i].x;
    const actualheight = buttons[i].h - buttons[i].y;

    if(clickX >= buttons[i].x && clickX <= (buttons[i].x + actualwidth) && 
        clickY >= buttons[i].y && clickY <= (buttons[i].y + actualheight)) {
      window.botonActual = buttons[i];
      eval(buttons[i].down);
      return; // stop execution once hit found
    }
  }

});

window.addEventListener('mouseup', function(event) {
    window.buttondown = false;
    window.isDragging = false;
    window.draggedButton = null;
});


window.addEventListener('mousemove', function(event) {
  const rect = canvas.getBoundingClientRect();
window.xmg = event.clientX - rect.left;
    window.ymg = event.clientY - rect.top;
if (window.isDragging && window.draggedButton) {
        const halfWidth = (window.draggedButton.w - window.draggedButton.x) / 2;
        const halfHeight = (window.draggedButton.h - window.draggedButton.y) / 2;

        const currentW = window.draggedButton.w - window.draggedButton.x;
        const currentH = window.draggedButton.h - window.draggedButton.y;

        window.draggedButton.x = window.xmg - halfWidth;
        window.draggedButton.y = window.ymg - halfHeight;

        window.draggedButton.w = window.draggedButton.x + currentW;
        window.draggedButton.h = window.draggedButton.y + currentH;
    }
});

canvas.addEventListener('click', function(event) {
    const rect = canvas.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const clickY = event.clientY - rect.top;

    let clicked = false;

    for(let i = 0; i < buttons.length; i++){
        if (clickX >= buttons[i].x && clickX <= (buttons[i].x + buttons[i].w) && 
            clickY >= buttons[i].y && clickY <= (buttons[i].y + buttons[i].h)) {
          //alert("Dynamic Button " + (i + 1) + " clicked!");
          window.botonActual = buttons[i];
          eval(buttons[i].code);
          return; // stop execution once hit found
        }
      }
    window.xm = clickX;
    window.ym = clickY;
});

const interz = setInterval(() =>{
  ctx.clearRect(0, 0, processCanvas.width, processCanvas.height);
  for(let i=0; i<buttons.length; i++) {
    drawButton(buttons[i].color, buttons[i].x, buttons[i].y, buttons[i].w - buttons[i].x, buttons[i].h - buttons[i].y, "New Button");
  }
  // draw every process that is on the buttons, draw a each process(canvas) on top of the buttons that have it
  for(let i=0; i<buttons.length; i++) {
    if(buttons[i].process) {
      ctx.drawImage(processCanvas, buttons[i].x, buttons[i].y, buttons[i].w - buttons[i].x, buttons[i].h - buttons[i].y);
    }
  }

}, 1);

</script>
