<canvas id="canvas" style="width: 100%; height: 100%;"></canvas>
<canvas id="process" style="width: 100%; height: 100%; display:none "></canvas>

<script>
  //get image from process and apply it to window.img
  const processCanvas = document.getElementById('process');
  const processCtx = processCanvas.getContext('2d');
  processCanvas.width = window.innerWidth;
  processCanvas.height = window.innerHeight;
  
  processCtx.fillStyle = 'red';
  processCtx.beginPath();

  processCtx.arc(150, 150, 50, 0, Math.PI * 2);
  processCtx.fill();

  contador = 0;
  // ADD some sorth of animation to it
  const intervalx = setInterval(() => {
     contador += 1;
    processCtx.clearRect(0, 0, processCanvas.width, processCanvas.height);
    processCtx.fillStyle = 'red';
    processCtx.beginPath();
    // move a square across the screen top to bottom
    processCtx.rect(100 + contador, 100 + contador, 50, 50);
    processCtx.fill();
  }, 1);

</script>

window.onload = function() {
    for(let i=0; i<buttons.length; i++) {
        window.botonActual = buttons[i];
        eval(buttons[i].init);
      
        drawButton(buttons[i].color, buttons[i].x, buttons[i].y, buttons[i].w - buttons[i].x, buttons[i].h - buttons[i].y, "New Button");
    }
};

document.addEventListener('keydown', (event) => {
  // event.key devuelve la letra o tecla presionada
  if (event.key === 'x') {
    window.h = window.ym;
    window.w = window.xm;
  }else if(event.key === 'c') {
    window.addbutton();
  }else if(event.key === 's'){
    console.log(buttons);
  }
});

window.addbutton = () => {
    color = prompt("color:");
    if(color == null) color = "#B2BEB5";
    textx = prompt("text:");
    codexc = prompt("init js:");
    codex = prompt("click js:");
    buttons.push({x: window.xm, y: window.ym, w: window.w, h: window.h, code: codex, init: codexc});
    drawButton(color, window.xm, window.ym, window.w - window.xm, window.h - window.ym, textx, codex, codexc);
    window.botonActual = buttons[buttons.length - 1];
    eval(buttons[buttons.length - 1].init);
};

function drawButton(color, x,y,width,height,text,code,initCode) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
    
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.textAlign = "center";
    ctx.fillText(text, x + width / 2, y + height / 2 + 7);
}

canvas.addEventListener('click', function(event) {
    const rect = canvas.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const clickY = event.clientY - rect.top;

    let clicked = false;

    for(let i = 0; i < buttons.length; i++){
        if (clickX >= buttons[i].x && clickX <= (buttons[i].x + buttons[i].w) && 
            clickY >= buttons[i].y && clickY <= (buttons[i].y + buttons[i].h)) {
          //alert("Dynamic Button " + (i + 1) + " clicked!");
          window.botonActual = buttons[i];
          eval(buttons[i].code);
          return; // stop execution once hit found
        }
      }
    window.xm = clickX;
    window.ym = clickY;
});
</script>
