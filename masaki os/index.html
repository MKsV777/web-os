<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden; /* kil the scrolling bars*/
    width: 100vw;
    height: 100vh;
    background: linear-gradient(0deg, #c9eed4 0%, #cbe1ed 100%)
  }
</style>

<div style="position: relative; width: 100vw; height: 100vh; overflow: hidden;">
  
  <canvas id="canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;"></canvas>
  
  <div id="turn" style="position: absolute; top: 0; right: 0; width: 30%; height: 100%; background: rgba(221, 221, 221, 0.2); box-sizing: border-box; padding: 10px; z-index: 100; pointer-events: none; display: none">
    
    <textarea id="textearea" style="width: 100%; height: 30%; resize: none; box-sizing: border-box; pointer-events: auto; background: transparent; color: white; border: 1px solid white; font-family: monospace;"></textarea>
    
    <button onclick="const textarea = document.getElementById('textearea'); buttons = JSON.parse(textarea.value); ctx.clearRect(0,0,canvas.width,canvas.height); for(let i=0; i<buttons.length; i++) drawButton(buttons[i].color, buttons[i].x, buttons[i].y, buttons[i].w - buttons[i].x, buttons[i].h - buttons[i].y, buttons[i].text);" 
            style="pointer-events: auto; width: 100%; margin-top: 5px; background: transparent; color: white; border: 1px solid white; padding: 5px; cursor: pointer;">
      sync
    </button>
  </div>

</div>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // Set canvas size to fill the window
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
/*

  img.src ="./public/placeholder.svg";

img.addEventListener("load", () => {

var buttons = [
  {
    "x": 10,
    "y": 15,
    "w": 1520,
    "h": 80,
    "code": "",
    "init": "",
    "color": "orange",
    "text": ""
  },
  {
    "x": 100,
    "y": 100,
    "w": 844,
    "h": 439.19999998807907,
    "code": "",
    "init": "let img = new Image(); img.src = '/webos.png'; img.onload = function() { ctx.drawImage(img, buttons[1].x, buttons[1].y, buttons[1].w - buttons[1].x, buttons[1].h - buttons[1].y); };",
    "color": "white",
    "text": "image"
  },
  {
    "x": 900,
    "y": 100,
    "w": 1384.7999997138977,
    "h": 290,
    "code": "",
    "init": "",
    "color": "orange",
    "text": "Masaki OS \n \n better window managing for your \n web apps"
  },
  {
    "x": 1005,
    "y": 300,
    "w": 1200,
    "h": 390,
    "code": "window.location.replace('https://web-os-six-xi.vercel.app/src/web.html');",
    "init": "",
    "color": "green",
    "text": "start using NOW!"
  },
  {
    "x": 1005,
    "y": 400,
    "w": 1200,
    "h": 490,
    "code": "const editor = document.getElementById('turn'); editor.style.display = (editor.style.display === 'block') ? 'none' : 'block';",
    "init": "",
    "color": "green",
    "text": "use ui editor"
  }
];

function updatetextarea(){
  const textarea = document.getElementById('textearea');
  textarea.value = JSON.stringify(buttons, null, 2);
}

window.onload = function() {
    for(let i=0; i<buttons.length; i++) {
        window.botonActual = buttons[i];
        eval(buttons[i].init);
        drawButton(buttons[i].color, buttons[i].x, buttons[i].y, buttons[i].w - buttons[i].x, buttons[i].h - buttons[i].y, buttons[i].text);
    }
    updatetextarea();
};

// i should press click, letter x then click and then another click and then another letter to get data
document.onkeypress = function (e) {
    e = e || window.event;
    console.log(window.xm / canvas.width, " " ,window.ym / canvas.height, " ", window.w / canvas.width, " ", window.h / canvas.height);
};

document.addEventListener('keydown', (event) => {
  // event.key devuelve la letra o tecla presionada
  if (event.key === '.') {
    window.h = window.ym;
    window.w = window.xm;
  }else if(event.key === ',') {
    window.addbutton();
  }else if(event.key === '¡'){
    console.log(buttons);
  }
});

window.addbutton = () => {
    codexc = "";
    codex = "";
    colorx = prompt("color");
    textxd = prompt("text");
    buttons.push({x: window.xm, y: window.ym, w: window.w, h: window.h, code: codex, init: codexc, color: colorx, text: textxd});
    drawButton(colorx, window.xm, window.ym, window.w - window.xm, window.h - window.ym, textxd, codex, codexc);
    window.botonActual = buttons[buttons.length - 1];
    eval(buttons[buttons.length - 1].init);
    updatetextarea();
};

function drawButton(color, x,y,width,height,text,code,initCode,) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);    
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.textAlign = "center";
    const lines = (text || "").split('\n');
    const lineHeight = 24;
    const totalTextHeight = lines.length * lineHeight;
    let startY = y + (height / 2) - (totalTextHeight / 2) + (lineHeight / 2) + 4;
    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], x + width / 2, startY + (i * lineHeight));
    }
}

canvas.addEventListener('click', function(event) {
    const rect = canvas.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const clickY = event.clientY - rect.top;

    let clicked = false;

    for(let i = 0; i < buttons.length; i++){
        if (clickX >= buttons[i].x && clickX <= (buttons[i].w) && 
            clickY >= buttons[i].y && clickY <= (buttons[i].h)) {
          //alert("Dynamic Button " + (i + 1) + " clicked!");
          window.botonActual = buttons[i];
          eval(buttons[i].code);
          return; // stop execution once hit found
        }
      }
    window.xm = clickX;
    window.ym = clickY;
});
</script>
