<canvas id="canvas" style="width: 100%; height: 100%;"></canvas>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // Set canvas size to fill the window
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
/*

img.addEventListener("load", () => {

});*/

var buttons = [
];

window.onload = function() {
    for(let i=0; i<buttons.length; i++) {
        drawButton("#28a745", buttons[i].x, buttons[i].y, buttons[i].w - buttons[i].x, buttons[i].h - buttons[i].y, "New Button");
    }
};

// i should press click, letter x then click and then another click and then another letter to get data
document.onkeypress = function (e) {
    e = e || window.event;
    console.log(window.xm / canvas.width, " " ,window.ym / canvas.height, " ", window.w / canvas.width, " ", window.h / canvas.height);
};

document.addEventListener('keydown', (event) => {
  // event.key devuelve la letra o tecla presionada
  if (event.key === 'x') {
    window.h = window.ym;
    window.w = window.xm;
  }else if(event.key === 'c') {
    window.addbutton();
  }else if(event.key === 's'){
    console.log(buttons);
  }
});

window.addbutton = () => {
    buttons.push({x: window.xm, y: window.ym, w: window.w, h: window.h, code: "alert('Button Clicked!')"});
    drawButton("#28a745", window.xm, window.ym, window.w - window.xm, window.h - window.ym, "New Button", "alert('Button Clicked!')");
};

function drawButton(color, x,y,width,height,text,code) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, width, height);
    
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.textAlign = "center";
    ctx.fillText(text, x + width / 2, y + height / 2 + 7);
}

canvas.addEventListener('click', function(event) {
    const rect = canvas.getBoundingClientRect();
    const clickX = event.clientX - rect.left;
    const clickY = event.clientY - rect.top;

    let clicked = false;

    for(let i = 0; i < buttons.length; i++){
        if (clickX >= buttons[i].x && clickX <= (buttons[i].x + buttons[i].w) && 
            clickY >= buttons[i].y && clickY <= (buttons[i].y + buttons[i].h)) {
          //alert("Dynamic Button " + (i + 1) + " clicked!");
          eval(buttons[i].code); // execute the code associated with the button
          return; // stop execution once hit found
        }
      }
    window.xm = clickX;
    window.ym = clickY;
});
</script>
